name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verify migrations apply cleanly
        working-directory: backend
        run: DATABASE_URL=sqlite:///./ci_migration.db python -m alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: DATABASE_URL=sqlite:///./ci.db python -m pytest -q
      - name: Run synthetic pipeline smoke test
        working-directory: backend
        run: python scripts/run_synthetic_batch.py --count 100
      - name: Train recovery-probability model
        working-directory: backend
        run: python -m app.ml.train
      - name: Run baseline vs adaptive offline evaluation
        working-directory: backend
        run: python scripts/evaluate_policies.py --count 1000

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
