# Local development services. PostgreSQL is authoritative; Redis is the
# reconstructable RQ transport used by action workers.
# The backend and frontend run with `uvicorn` / `npm run dev` directly
# during local dev; production/containers are optional (see docker-compose.prod.yml).
#
# Profiles:
#   docker compose up -d              -> postgres + redis (dev)
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build  -> full stack

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recoveryos
      POSTGRES_PASSWORD: recoveryos
      POSTGRES_DB: recoveryos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - recoveryos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

volumes:
  recoveryos_pg_data:
